name: Collect news

on:
  schedule:
    # GitHub 예약 실행은 이 저장소에서 늘 3~4시간 늦게 오고, 같은 예약 식의 밀린 회차는 하나로 합쳐진다
    # (2026-11 실측: '30분마다' 한 줄은 하루 4~5번만 깨어났고, 하루 한 번짜리 줄은 늦더라도 한 번씩은 왔다).
    # 그래서 시간마다 따로 줄을 둔다 — 줄마다 하루 한 번씩 오면 대략 한 시간에 한 번 깨어난다.
    # 깨어나면 아래 'gate' 단계가 마지막 수집 후 2시간 40분이 지났을 때만 수집한다(건너뛰는 회차는 10초 안에 끝난다).
    # 정확한 3시간 간격이 필요하면 DEPLOY.md '외부 예약으로 정시 실행' 참고.
    - cron: '7 0 * * *'
    - cron: '37 1 * * *'
    - cron: '7 2 * * *'
    - cron: '37 3 * * *'
    - cron: '7 4 * * *'
    - cron: '37 5 * * *'
    - cron: '7 6 * * *'
    - cron: '37 7 * * *'
    - cron: '7 8 * * *'
    - cron: '37 9 * * *'
    - cron: '7 10 * * *'
    - cron: '37 11 * * *'
    - cron: '7 12 * * *'
    - cron: '37 13 * * *'
    - cron: '7 14 * * *'
    - cron: '37 15 * * *'
    - cron: '7 16 * * *'
    - cron: '37 17 * * *'
    - cron: '7 18 * * *'
    - cron: '37 19 * * *'
    - cron: '7 20 * * *'
    - cron: '37 21 * * *'
    - cron: '7 22 * * *'
    - cron: '37 23 * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: '차단 재시도 회차(자동 재실행이 넘겨 주는 값 — 직접 실행할 때는 비워 둠)'
        required: false
        default: '0'
  push:
    branches: [ main ]
    paths: [ 'scripts/collect-news.mjs', 'article-clean.js', 'package.json', '.github/workflows/collect-news.yml' ]

permissions:
  contents: write
  actions: write   # 아래 '데일리 시황 깨우기'에서 daily-brief 워크플로를 실행하기 위해

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 외부 응답이 멈춰도 다음 회차를 막지 않게
    steps:
      - uses: actions/checkout@v5
        with:
          # 트리거 커밋이 아니라 최신 main 에서 시작한다(대기 중에 앞선 회차가 데이터를 갱신했을 수 있음).
          ref: main
          fetch-depth: 30
      - name: Gate (마지막 수집 후 2시간 40분 경과 시에만)
        id: gate
        run: |
          last=$(git log -1 --format=%ct --grep='refresh news feed' || true)
          now=$(date +%s)
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$last" ] || [ $((now - last)) -ge 9600 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "수집 실행 (마지막 수집: ${last:-기록 없음})"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "마지막 수집 후 $(( (now - last) / 60 ))분 — 건너뜀"
          fi
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      # 본문 추출 엔진(Readability + linkedom) — package-lock.json 기준 설치
      - name: Install extractor deps
        if: steps.gate.outputs.run == 'true'
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Collect
        id: collect
        if: steps.gate.outputs.run == 'true'
        run: node scripts/collect-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      # 구글 뉴스가 이 실행 서버를 막아 수집기가 저장 없이 끝난 회차(blocked)는 커밋하지 않고,
      # 다른 서버에서 곧바로 다시 돌린다(최대 2번 — 그래도 막히면 다음 예약 회차가 이어받는다).
      - name: Retry on another runner if blocked
        if: steps.collect.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ github.event.inputs.retry || '0' }}
        run: |
          n=$((RETRY + 1))
          if [ "$n" -le 2 ]; then gh workflow run collect-news.yml --ref main -f retry="$n" && echo "차단 — 다른 서버에서 재실행 요청(${n}/2)"; else echo "차단 — 재시도 2회 소진, 다음 예약 회차에 맡김"; fi
      - name: Rebuild LP roster
        if: steps.gate.outputs.run == 'true' && steps.collect.outputs.blocked != 'true'
        run: node scripts/gen-institutions.mjs
      - name: Commit updated feed
        if: steps.gate.outputs.run == 'true' && steps.collect.outputs.blocked != 'true'
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news.json insights.json institutions.json fundraising.json investments.json bodies feed usage ai-rejected.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh news feed [skip ci]"
            # 수집이 길어진 사이 main 이 앞서가면 리베이스 후 재시도 (푸시 경합 방지)
            for i in 1 2 3; do
              git push && break
              # 데이터 파일 충돌은 이번 회차 결과(전체 스냅샷)로 해결. -X theirs 로 안 풀리는 '수정/삭제' 충돌(bodies/*.json)은
              # 이번 회차에 지운 파일이면 지우고, 이번 회차에 남긴 파일이면 이번 회차 것으로 둔다.
              if ! git pull --rebase -X theirs origin main; then
                git diff --name-only --diff-filter=U | while read -r f; do
                  if git cat-file -e ":3:$f" 2>/dev/null; then git checkout --theirs -- "$f" && git add -- "$f"; else git rm -q -- "$f"; fi
                done
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
      # 수집이 실패·시간 초과로 끊겨도 Claude 사용액 장부(usage/)는 남겨 다음 회차가 하루 한도를 정확히 계산하게 한다.
      # 시간 초과는 '실패'가 아니라 '취소'로 끝나므로 cancelled() 도 함께 본다(2026-11-08: 50분 초과 회차에서 이 단계가 건너뛰어졌다).
      - name: Record Claude usage on failure
        if: (failure() || cancelled()) && steps.gate.outputs.run == 'true'
        run: |
          [ -d usage ] || exit 0
          rm -rf /tmp/usage-keep && cp -r usage /tmp/usage-keep
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p usage && cp /tmp/usage-keep/*.collect.json usage/ 2>/dev/null || exit 0
            git add -A usage
            git diff --cached --quiet && exit 0
            git commit -q -m "chore: Claude 사용액 기록(수집 실패 회차) [skip ci]"
            git push && exit 0
          done
          exit 1
      # GitHub 예약 실행은 몇 시간씩 밀리거나 빠진다(2026-11 실측: 데일리 시황 06:23 예약이 10:30 에 한 번만 돔).
      # 수집이 깨어날 때마다(건너뛰는 회차 포함) 오늘(KST 06시 이후) 시황이 아직 없으면 데일리 시황을 바로 실행시킨다.
      - name: Kick daily brief if stale
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(TZ=Asia/Seoul date +%Y%m%d); h=$(TZ=Asia/Seoul date +%H)
          key=$(git fetch -q origin main 2>/dev/null; git show FETCH_HEAD:market.json 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin).get('dateKey',''))" 2>/dev/null || true)
          echo "market.json dateKey=${key:-없음} · 오늘 ${today} ${h}시(KST)"
          if [ "$key" != "$today" ] && [ "$h" -ge 6 ]; then gh workflow run daily-brief.yml --ref main && echo "데일리 시황 실행 요청"; fi

