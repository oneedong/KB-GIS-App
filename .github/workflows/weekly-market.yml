name: Weekly market report

on:
  schedule:
    # 매주 월요일 아침, 지난주 월~일분을 만든다. GitHub 예약 실행은 몇 시간씩 늦게 깨어나므로(2026-10 실측
    # 약 6시간) 여러 번 깨우고, 만들지 말지는 스크립트가 시각으로 정한다(월 05:00 KST 이후, 이미 있으면 건너뜀).
    # 월요일 메일 발송 예약 작업도 보고서가 없으면 이 워크플로를 직접 실행한다.
    - cron: '23 20 * * 0'    # 월 05:23 KST
    - cron: '43 23 * * 0'    # 월 08:43 KST — 따라잡기
    - cron: '13 3 * * 1'     # 월 12:13 KST — 따라잡기
    - cron: '13 22 * * 1'    # 화 07:13 KST — 따라잡기
  workflow_dispatch:
    inputs:
      date:
        description: '보고일 = 그 주 일요일(YYYY-MM-DD). 비우면 가장 최근에 끝난 주'
        required: false
        default: ''
      force:
        description: '일요일이 아니거나 이미 있어도 생성'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-market
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Build weekly report
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          node scripts/weekly-market.mjs $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRA_HOLIDAYS: ${{ vars.EXTRA_HOLIDAYS }}
      # 메일 '웹에서 보기'용 페이지(weekly/<날짜>.html) — 주간 메일 예약 작업이 이 주소를 링크한다
      - name: Build web page for weekly mail
        run: node scripts/weekly-email.mjs --page
      - name: Commit report
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A weekly usage
          if ! git diff --cached --quiet; then
            git commit -m "chore: 주간 시장현황 갱신 [skip ci]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
