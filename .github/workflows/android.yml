name: Android APK

# android/ 가 바뀌면 APK 를 새로 빌드해 GitHub Release "android" 에 KB-GIS-Market.apk 로 올린다.
#   다운로드: https://github.com/oneedong/KB-GIS-App/releases/download/android/KB-GIS-Market.apk
# 앱은 웹앱을 여는 껍데기라 화면·뉴스가 바뀔 때는 다시 빌드할 필요가 없다.
# 서명 키: Secret APK_SIGNING_PASSWORD 가 있으면 고정 키(새 APK 가 기존 앱 위에 설치됨, 아래 Signing key 단계),
#   없으면 빌드마다 임시 키 → 기존 앱을 지우고 설치해야 한다.
# 실패하면 빌드 기록을 "android-build-log" 사전 릴리스 본문에 남긴다.
on:
  push:
    branches: [ main ]
    paths: [ 'android/**', '.github/workflows/android.yml' ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Signing key
        # 고정 서명 키: 저장소 Secret APK_SIGNING_PASSWORD 가 있으면, 처음 한 번 키를 만들어 그 값으로 암호화해
        # 사전 릴리스 "android-signing" 에 보관하고 이후 빌드는 같은 키로 서명한다 → 새 APK 가 기존 앱 위에 바로 설치된다.
        # Secret 이 없으면 예전처럼 이번 빌드용 임시 키(기존 앱 삭제 후 설치). 키를 한 번 만든 뒤엔 Secret 없이 빌드하지 않는다.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SIGNING_PASSWORD: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: |
          D="$RUNNER_TEMP/sign"; mkdir -p "$D"; K="$D/release.p12"
          if gh release view android-signing >/dev/null 2>&1; then
            [ -n "$APK_SIGNING_PASSWORD" ] || { echo "::error::고정 서명 키가 있는데 Secret APK_SIGNING_PASSWORD 가 없습니다 — 임시 키로 만들면 기존 앱 위에 설치되지 않습니다"; exit 1; }
            gh release download android-signing -p signing.p12.enc -D "$D"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in "$D/signing.p12.enc" -out "$K" -pass env:APK_SIGNING_PASSWORD \
              || { echo "::error::보관된 서명 키를 열지 못했습니다 — Secret APK_SIGNING_PASSWORD 가 키를 만들 때와 다릅니다"; exit 1; }
            echo "보관된 고정 키로 서명"
          elif [ -n "$APK_SIGNING_PASSWORD" ]; then
            keytool -genkeypair -keystore "$K" -storetype PKCS12 -storepass "$APK_SIGNING_PASSWORD" -keypass "$APK_SIGNING_PASSWORD" \
              -alias app -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=${GITHUB_REPOSITORY#*/}" >/dev/null
            openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in "$K" -out "$D/signing.p12.enc" -pass env:APK_SIGNING_PASSWORD
            gh release create android-signing --prerelease --target "$GITHUB_SHA" --title "서명 키 보관 (암호화 · 지우지 마세요)" \
              --notes "안드로이드 앱 고정 서명 키(Secret APK_SIGNING_PASSWORD 로 암호화). 지우면 다음 APK 는 기존 앱을 지우고 다시 설치해야 합니다." \
              "$D/signing.p12.enc"
            echo "고정 키를 새로 만들어 보관"
          else
            echo "Secret APK_SIGNING_PASSWORD 없음 → 이번 빌드용 임시 키"; exit 0
          fi
          echo "KEYSTORE=$K" >> "$GITHUB_ENV"
      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          KS_PASS: ${{ secrets.APK_SIGNING_PASSWORD }}
        run: bash android/build.sh 2>&1 | tee build.log
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vn=$(grep -m1 '^version:' build.log | sed 's/^version: *//')
          cat > notes.md <<EOF
          **KB GIS Market** 안드로이드 앱 · ${vn} · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST

          1. 휴대폰에서 아래 **KB-GIS-Market.apk** 를 받아 엽니다.
          2. "출처를 알 수 없는 앱" 허용 안내가 나오면 허용 → 설치. Play 프로텍트 경고는 "그래도 설치".
          3. 앱 목록의 KB GIS Market 을 엽니다.

          설치 안내: https://oneedong.github.io/KB-GIS-App/install.html
          EOF
          gh release view android >/dev/null 2>&1 \
            || gh release create android --target "$GITHUB_SHA" --title "KB GIS Market 안드로이드 앱" --notes-file notes.md
          gh release upload android android/build/KB-GIS-Market.apk --clobber
          gh release edit android --notes-file notes.md
          gh release delete android-build-log --yes --cleanup-tag 2>/dev/null || true
      - name: Save build log
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; tail -c 60000 build.log 2>/dev/null || echo "build.log 없음"; echo '```'; } > log.md
          if gh release view android-build-log >/dev/null 2>&1; then
            gh release edit android-build-log --notes-file log.md
          else
            gh release create android-build-log --prerelease --target "$GITHUB_SHA" --title "android build log" --notes-file log.md
          fi
