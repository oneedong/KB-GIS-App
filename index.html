<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>KB GIS · 해외대체투자</title>
<meta name="description" content="국내 LP·해외 GP 동향, 기관별 투자내역, 데일리 시황과 해외대체투자 용어 해설을 한곳에서.">

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FBF8F2">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png">

<!-- iOS home-screen install -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KB GIS">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 0; height: 0; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #EDE5D8;   /* 회벽보다 한 톤 깊은 바탕 */
    color: #2B2520;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-tap-highlight-color: transparent;
  }
  input { font-family: inherit; }
  input::placeholder { color: #A3988A; }
  a { -webkit-tap-highlight-color: transparent; }
  ::selection { background: rgba(196, 154, 104, .35); }

  /* #root centers the phone frame and fills the viewport */
  #root {
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 100dvh;
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Phone frame as a centered card on large screens (matches the design mockup) */
  .app-frame {
    width: 404px;
    height: 872px;
    min-width: 0;
    background: #FBF8F2;
    border-radius: 36px;
    border: 1px solid #DCD1C1;
    box-shadow: 0 24px 60px rgba(60,42,25,.16);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  /* On actual phones / installed app: fill the whole screen, drop the frame chrome */
  @media (max-width: 480px) {
    body { background: #FBF8F2; }
    #root { padding: 0; align-items: stretch; }
    .app-frame {
      width: 100%;
      height: 100dvh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }
  @media (display-mode: standalone) {
    #root { padding: 0; align-items: stretch; }
    .app-frame {
      width: 100%;
      height: 100dvh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  /* Desktop (>= 900px): fill the whole browser window, drop the card chrome */
  @media (min-width: 900px) {
    #root { padding: 0; align-items: stretch; }
    .app-frame {
      width: 100vw;
      height: 100dvh;
      max-width: none;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<!-- 기사 본문 정제(수집기와 같은 규칙) · 본문 추출 -->
<script src="./article-clean.js"></script>
<script src="./vendor/readability.js"></script>
<!-- 앱: src/*.tsx 를 tsc 로 js/ 에 컴파일 (npm run build) -->
<script src="./js/ui.js"></script>
<script src="./js/data.js"></script>
<script src="./js/glossary.js"></script>
<script src="./js/reader.js"></script>
<script src="./js/brief.js"></script>
<script src="./js/profiles.js"></script>
<script src="./js/article.js"></script>
<script src="./js/app.js"></script>

<script>
  // Register the service worker so the app works offline and is installable.
  // 새 버전 배포 시: 앱을 껐다 켜면(또는 새로고침) 새 서비스워커가 즉시 적용되고
  // 페이지가 한 번 자동 새로고침되어 최신 화면으로 갱신됩니다.
  if ('serviceWorker' in navigator) {
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;            // 새 SW가 제어권을 잡으면 한 번만 새로고침
      refreshing = true;
      window.location.reload();
    });
    window.addEventListener('load', function () {
      // updateViaCache:'none' → sw.js 를 항상 새로 받아 새 버전을 놓치지 않음
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .then(function (reg) {
          reg.update();                  // 매 실행마다 새 버전 확인
          setInterval(function () { reg.update(); }, 60 * 60 * 1000);
        })
        .catch(function (e) { console.warn('SW registration failed', e); });
    });
  }
</script>
</body>
</html>
