name: Daily market brief

on:
  schedule:
    # 전일 시장 마감 기준 브리핑. 정각 예약은 2026-10 실측 약 3시간 늦게(11시 전후) 돌아,
    # 미국 장 마감(06:00 KST) 직후인 06:23 KST 로 앞당겨 아침 출근 시간대에 맞춘다.
    - cron: '23 21 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'scripts/daily-brief.mjs', 'scripts/alt-brief.mjs', '.github/workflows/daily-brief.yml' ]

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build market brief
        run: node scripts/daily-brief.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm ci --omit=dev --no-audit --no-fund
      # 오늘의 해외대체(Claude Sonnet 5.5) — 실패해도 시황 커밋은 진행
      - name: Build alt-investment brief
        continue-on-error: true
        run: node scripts/alt-brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      - name: Commit brief
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A market.json history.json briefs alt-brief.json usage
          if ! git diff --cached --quiet; then
            git commit -m "chore: 데일리 시황 갱신 [skip ci]"
            # 뉴스 수집 워크플로와 겹치면 리베이스 후 재시도 (푸시 경합 방지)
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }   # 데이터 파일 충돌은 이번 회차 결과(전체 스냅샷)로 해결
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
