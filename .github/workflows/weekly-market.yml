name: Weekly market report

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦게 깨어난다(2026-10 실측 약 6시간). 그래서 여러 번 깨우고, 만들지 말지는
    # 스크립트가 시각으로 정한다: 이번 주 마지막 영업일(공휴일 제외) 16:00 KST 이후에만 만들고,
    # 그 전에 만들어진 보고서는 다시 만든다. 금요일이 공휴일이면 목요일, 목·금이 모두 쉬면 수요일분이 된다.
    - cron: '13 3 * * 5'     # 금 12:13 KST — 늦게 깨어나면 금요일 저녁
    - cron: '40 8 * * 1-5'   # 평일 17:40 KST — 공휴일 주(목·수요일 마감) 대비
    - cron: '23 1 * * 6,0'   # 토·일 10:23 KST — 따라잡기
  workflow_dispatch:
    inputs:
      date:
        description: '보고일(YYYY-MM-DD). 비우면 오늘'
        required: false
        default: ''
      force:
        description: '마지막 영업일이 아니어도 생성'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: weekly-market
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Build weekly report
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="$ARGS --date ${{ github.event.inputs.date }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          node scripts/weekly-market.mjs $ARGS
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXTRA_HOLIDAYS: ${{ vars.EXTRA_HOLIDAYS }}
      - name: Commit report
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A weekly usage
          if ! git diff --cached --quiet; then
            git commit -m "chore: 주간 시장현황 갱신 [skip ci]"
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
