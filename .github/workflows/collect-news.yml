name: Collect news

on:
  schedule:
    # GitHub 예약 실행은 자주 늦거나 빠진다(2026-10 실측: 매시간 예약에도 실제로는 4~7시간 간격).
    # 30분마다 깨우고(:07·:37), 아래 'gate' 단계가 마지막 수집 후 2시간 40분이 지났을 때만 수집한다.
    # 몇 번 빠져도 다음 기회에 따라잡도록 깨우는 횟수를 늘린 것(건너뛰는 회차는 10초 안에 끝난다).
    # 정확한 3시간 간격이 필요하면 DEPLOY.md '외부 예약으로 정시 실행' 참고.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'scripts/collect-news.mjs', 'article-clean.js', 'package.json', '.github/workflows/collect-news.yml' ]

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # 외부 응답이 멈춰도 다음 회차를 막지 않게
    steps:
      - uses: actions/checkout@v5
        with:
          # 트리거 커밋이 아니라 최신 main 에서 시작한다(대기 중에 앞선 회차가 데이터를 갱신했을 수 있음).
          ref: main
          fetch-depth: 30
      - name: Gate (마지막 수집 후 2시간 40분 경과 시에만)
        id: gate
        run: |
          last=$(git log -1 --format=%ct --grep='refresh news feed' || true)
          now=$(date +%s)
          if [ "${{ github.event_name }}" != "schedule" ] || [ -z "$last" ] || [ $((now - last)) -ge 9600 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "수집 실행 (마지막 수집: ${last:-기록 없음})"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "마지막 수집 후 $(( (now - last) / 60 ))분 — 건너뜀"
          fi
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
      # 본문 추출 엔진(Readability + linkedom) — package-lock.json 기준 설치
      - name: Install extractor deps
        if: steps.gate.outputs.run == 'true'
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Collect
        if: steps.gate.outputs.run == 'true'
        run: node scripts/collect-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Rebuild LP roster
        if: steps.gate.outputs.run == 'true'
        run: node scripts/gen-institutions.mjs
      - name: Commit updated feed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news.json insights.json institutions.json fundraising.json investments.json bodies feed usage ai-rejected.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh news feed [skip ci]"
            # 수집이 길어진 사이 main 이 앞서가면 리베이스 후 재시도 (푸시 경합 방지)
            for i in 1 2 3; do
              git push && break
              # 데이터 파일 충돌은 이번 회차 결과(전체 스냅샷)로 해결. -X theirs 로 안 풀리는 '수정/삭제' 충돌(bodies/*.json)은
              # 이번 회차에 지운 파일이면 지우고, 이번 회차에 남긴 파일이면 이번 회차 것으로 둔다.
              if ! git pull --rebase -X theirs origin main; then
                git diff --name-only --diff-filter=U | while read -r f; do
                  if git cat-file -e ":3:$f" 2>/dev/null; then git checkout --theirs -- "$f" && git add -- "$f"; else git rm -q -- "$f"; fi
                done
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; exit 1; }
              fi
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
      # 수집이 실패·시간 초과로 끊겨도 Claude 사용액 장부(usage/)는 남겨 다음 회차가 하루 한도를 정확히 계산하게 한다
      - name: Record Claude usage on failure
        if: failure() && steps.gate.outputs.run == 'true'
        run: |
          [ -d usage ] || exit 0
          rm -rf /tmp/usage-keep && cp -r usage /tmp/usage-keep
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p usage && cp /tmp/usage-keep/*.collect.json usage/ 2>/dev/null || exit 0
            git add -A usage
            git diff --cached --quiet && exit 0
            git commit -q -m "chore: Claude 사용액 기록(수집 실패 회차) [skip ci]"
            git push && exit 0
          done
          exit 1
