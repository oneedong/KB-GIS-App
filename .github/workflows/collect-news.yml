name: Collect news

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'scripts/collect-news.mjs', 'article-clean.js', 'package.json', '.github/workflows/collect-news.yml' ]

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # 본문 추출 엔진(Readability + linkedom) — package-lock.json 기준 설치
      - name: Install extractor deps
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Collect
        run: node scripts/collect-news.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      - name: Rebuild LP roster
        run: node scripts/gen-institutions.mjs
      - name: Commit updated feed
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A news.json insights.json institutions.json fundraising.json investments.json bodies
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh news feed [skip ci]"
            # 수집이 길어진 사이 main 이 앞서가면 리베이스 후 재시도 (푸시 경합 방지)
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }   # 데이터 파일 충돌은 이번 회차 결과(전체 스냅샷)로 해결
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
