name: Secrets check (키 등록 여부 확인 — 값은 출력하지 않음)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 값이 아니라 '있음/없음'만 찍는다(표현식이 true/false 로 바뀐 뒤 로그에 남음)
      - name: Presence
        run: |
          echo "secrets.ANTHROPIC_API_KEY  : ${{ secrets.ANTHROPIC_API_KEY != '' }}"
          echo "vars.ANTHROPIC_API_KEY     : ${{ vars.ANTHROPIC_API_KEY != '' }}"
          echo "secrets.CLAUDE_API_KEY     : ${{ secrets.CLAUDE_API_KEY != '' }}"
          echo "secrets.ANTHROPIC_KEY      : ${{ secrets.ANTHROPIC_KEY != '' }}"
          echo "secrets.ANTHROPIC_API_TOKEN: ${{ secrets.ANTHROPIC_API_TOKEN != '' }}"
          echo "secrets.GEMINI_API_KEY     : ${{ secrets.GEMINI_API_KEY != '' }}"
      # 키가 있으면 무료 모델 목록 API 로 유효한지만 확인(HTTP 상태 코드만 출력)
      - name: Anthropic key validity
        env:
          K: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
        run: |
          if [ -z "$K" ]; then echo "ANTHROPIC_API_KEY·CLAUDE_API_KEY 모두 없음"; exit 0; fi
          echo "길이 ${#K}자 · 종류 ${K:0:10}"
          code=$(curl -s -o /dev/null -w "%{http_code}" https://api.anthropic.com/v1/models -H "x-api-key: $K" -H "anthropic-version: 2023-06-01")
          echo "models API HTTP $code (200 = 정상)"
