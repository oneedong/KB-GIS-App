name: Daily market brief

on:
  schedule:
    # 전일 시장 마감 기준 브리핑 — 미국 장 마감(06:00 KST, 서머타임 05:00) 직후에 나와야 한다.
    # GitHub 예약은 이 저장소에서 늘 3~4시간 늦게 온다(2026-11 실측: 06:23 예약이 10:00 전후에 실행).
    # 그래서 새벽 2~4시대(KST)에도 깨우는 줄을 두고, 아래 'gate' 단계가 06시 이전 회차는 건너뛴다.
    # 늦게 오면 06~08시에 실행되고, 제때 오면 건너뛴 뒤 06시 이후 줄이 처리한다.
    # 지수는 '직전에 끝난 거래일 종가' 기준이라 장중에 다시 만들어도 값이 바뀌지 않는다. 이른 회차만 90분 뒤 한 번 보강한다(Claude 브리핑은 하루 한 번만).
    - cron: '33 17 * * *'    # 02:33 KST (늦게 오면 06시 전후)
    - cron: '3 18 * * *'     # 03:03 KST
    - cron: '33 18 * * *'    # 03:33 KST
    - cron: '3 19 * * *'     # 04:03 KST
    - cron: '23 21 * * *'    # 06:23 KST
    - cron: '13 22 * * *'    # 07:13 KST
    - cron: '3 23 * * *'     # 08:03 KST
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: [ 'scripts/daily-brief.mjs', 'scripts/alt-brief.mjs', '.github/workflows/daily-brief.yml' ]

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main          # 예약이 늦게 와도 최신 main 기준으로 판단·갱신
      # 예약 회차만 거른다(직접 실행·수집기의 '깨우기'·코드 변경은 항상 실행).
      #  - 06:20(KST) 이전: 미국 장 마감 값이 자리 잡기 전이므로 건너뜀
      #  - 오늘 시황이 이미 있으면, 07:30 이전에 만든 경우에만 90분 뒤 한 번 더 갱신
      - name: Gate (06:20 이후 · 오늘 것이 없거나 이른 회차 보강일 때만)
        id: gate
        run: |
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            run=$(python3 - <<'PY'
          import json, datetime
          now = datetime.datetime.now(datetime.timezone.utc)
          kst = now + datetime.timedelta(hours=9)
          try:
              d = json.load(open('market.json'))
          except Exception:
              d = {}
          today = kst.strftime('%Y%m%d')
          age = 1e9
          try:
              age = (now - datetime.datetime.fromisoformat(str(d.get('ts', '')).replace('Z', '+00:00'))).total_seconds() / 60
          except Exception:
              pass
          hm = kst.hour * 60 + kst.minute
          if hm < 6 * 60 + 20:                      # 미국 장 마감(06:00 KST) 값이 자리 잡기 전
              print('false')
          elif d.get('dateKey') != today:
              print('true')
          else:
              # 오늘 것이 있으면 07:30 이전에 만든 경우에만 90분 뒤 한 번 더 갱신(환율·금리·헤드라인 보강)
              made = now - datetime.timedelta(minutes=age) + datetime.timedelta(hours=9)
              early = made.hour * 60 + made.minute < 7 * 60 + 30
              print('true' if (early and age >= 90 and kst.hour < 12) else 'false')
          PY
          )
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "$(TZ=Asia/Seoul date '+%m-%d %H:%M KST') · 실행=$run"
      - uses: actions/setup-node@v5
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Build market brief
        if: steps.gate.outputs.run == 'true'
        run: node scripts/daily-brief.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: npm ci --omit=dev --no-audit --no-fund
        if: steps.gate.outputs.run == 'true'
      # 오늘의 해외대체(Claude Sonnet 5.5) — 실패해도 시황 커밋은 진행
      - name: Build alt-investment brief
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: node scripts/alt-brief.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      - name: Commit brief
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "kbgis-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A market.json history.json briefs alt-brief.json usage
          if ! git diff --cached --quiet; then
            git commit -m "chore: 데일리 시황 갱신 [skip ci]"
            # 뉴스 수집 워크플로와 겹치면 리베이스 후 재시도 (푸시 경합 방지)
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }   # 데이터 파일 충돌은 이번 회차 결과(전체 스냅샷)로 해결
              [ "$i" = "3" ] && exit 1
            done
          else
            echo "No changes."
          fi
