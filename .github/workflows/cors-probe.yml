name: CORS probe (브라우저 직접 시세 조회 가능 여부 점검)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: CNBC symbols
        run: |
          S='.KS11|.KQ11|.SPX|.IXIC|.DJI|.STOXX50E|.STOXX50|.N225|KRW=|EURKRW=|EUR=|JPY=|JPYKRW=|.DXY|US10Y|@GC.1|@SI.1|@CL.1|@LCO.1|BTC.CM=|ETH.CM='
          E=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$S")
          curl -s -m 20 -H "Origin: https://oneedong.github.io" -A "Mozilla/5.0" "https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol?symbols=$E&requestMethod=itv&noform=1&partnerId=2&fund=1&exthrs=1&output=json&events=1" -o /tmp/q.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/q.json'))
          for q in d['FormattedQuoteResult']['FormattedQuote']:
              print(q.get('symbol'), '|', q.get('code'), '|', q.get('shortName') or q.get('name'), '|', q.get('last'), '|', q.get('change'), '|', q.get('change_pct'), '|', q.get('last_time'), '|', q.get('previous_day_closing'), '|', q.get('curmktstatus'))
          PY
