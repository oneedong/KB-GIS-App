name: Live quote check (배포된 앱이 실시간 시세를 받는지 확인)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm i --no-save --no-audit --no-fund playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Open deployed app
        run: |
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch();
          const p = await b.newPage({ viewport: { width: 400, height: 860 } });
          const res = [];
          p.on('response', (r) => { if (/quote\.cnbc\.com/.test(r.url())) res.push(r.status()); });
          p.on('console', (m) => { if (m.type() === 'error') console.log('console error:', m.text().slice(0, 200)); });
          await p.goto('https://oneedong.github.io/KB-GIS-App/?t=' + Date.now(), { waitUntil: 'networkidle' });
          await p.waitForTimeout(4000);
          const card = await p.evaluate(() => { const el = [...document.querySelectorAll('div')].find((d) => d.textContent.startsWith('오늘의 시황')); return el ? el.innerText.replace(/\n+/g, ' | ').slice(0, 300) : 'none'; });
          console.log('CNBC responses:', JSON.stringify(res));
          console.log('home card:', card);
          await b.close();
          JS
          node t.mjs
